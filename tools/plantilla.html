<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · DGMStudio41003</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F1D1A'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='34' text-anchor='middle' fill='%23D2AC66'%3ED%3C/text%3E%3C/svg%3E">
<!-- GENERADO por tools/pagina.js a partir de {{source}}: los cambios, en el original, no aquí.
     Como index.html, sin fuentes ni scripts de fuera: quien lee la política no deja su IP en
     ningún sitio más que en GitHub Pages. -->
<style>
  :root {
    --bg: #FBFAF7; --ink: #1F1D1A; --soft: #5F5A52; --faint: #8C857A; --line: #E9E3D8; --gold: #A8823F;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151412; --ink: #F2EDE4; --soft: #B8B0A3; --faint: #8A8377; --line: #2E2A25; --gold: #D2AC66; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.65 var(--sans); }
  a { color: inherit; text-underline-offset: 3px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 26px 0; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 600; letter-spacing: .01em; }
  .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: var(--gold);
          display: grid; place-items: center; font: 600 20px/1 var(--serif); }
  .top nav a { color: var(--soft); text-decoration: none; font-size: 15px; }
  article { padding: 28px 0 56px; }
  article h1 { font: 500 clamp(32px, 5vw, 46px)/1.12 var(--serif); letter-spacing: -.01em; margin: 0 0 18px; }
  article h2 { font: 500 26px/1.25 var(--serif); margin: 42px 0 12px; }
  article h3 { font-size: 18px; margin: 28px 0 8px; }
  article p, article li { color: var(--soft); }
  article strong { color: var(--ink); }
  article ul, article ol { padding-left: 22px; }
  article li { margin: 6px 0; }
  article table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 18px 0; display: block; overflow-x: auto; }
  article th, article td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  article code { font-size: .92em; }
  /* GitHub pone un enlace de ancla junto a cada título, que fuera de GitHub no lleva a ningún sitio. */
  article .anchor { display: none; }
  .site-footer { border-top: 1px solid var(--line); padding: 30px 0 46px; display: flex; flex-wrap: wrap;
                 justify-content: space-between; gap: 12px; color: var(--faint); font-size: 14px; }
  .site-footer a { color: var(--soft); }
  @media (max-width: 640px) { body { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/"><span class="mark" aria-hidden="true">D</span>DGMStudio41003</a>
    <nav><a href="/">Todas las apps</a></nav>
  </header>
  <article>
{{body}}
  </article>
  <footer class="site-footer">
    <span>© 2026 DGMStudio41003</span>
    <span>Contacto: <a href="mailto:dgmstudio41003@gmail.com">dgmstudio41003@gmail.com</a></span>
  </footer>
</div>
</body>
</html>
